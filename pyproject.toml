[project]
name = "trading-bot-api"
version = "0.1.0"
description = "FastAPI crypto trading bot API with CoinAPI data, CCXT exchange connectivity, TA-Lib indicators, and guarded strategy execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
talib = [
  "TA-Lib>=0.4.32"
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

